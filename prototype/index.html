<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpoonAte · Rewards prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#263b31;font:15px system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:#235d43;color:white;font-weight:650}button:hover{filter:brightness(.93)}button.secondary{background:#eeeee6;color:#263b31}button:disabled{opacity:.45;cursor:default}.demo{background:#263b31;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 5%;gap:12px;font-size:12px}.switch{display:flex;gap:6px}.switch button{padding:8px 14px;background:transparent;color:#fff}.switch button.active{background:#f1d780;color:#263b31}header{padding:22px 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dedfd6;background:white}.logo{font-size:25px;font-weight:850;letter-spacing:-1px}.logo span{color:#b17a27}small,.muted{color:#758076}main{max-width:1180px;margin:auto;padding:32px 24px 100px}h1{font-size:34px;letter-spacing:-1.2px;margin:8px 0}h2{font-size:23px;letter-spacing:-.6px}h3{margin:8px 0;font-size:18px}p{line-height:1.6}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:750}.hero{background:#e7eddf;border-radius:22px;padding:32px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;margin:24px 0}.hero h2{font-size:33px;max-width:430px;margin:10px 0}.pill{display:inline-block;border-radius:30px;background:#fff;padding:7px 12px;font-size:12px}.rewardbox{background:#fff;padding:24px;border-radius:16px;align-self:center}.progress{height:9px;background:#e7eadf;border-radius:20px;margin:17px 0;overflow:hidden}.progress i{display:block;height:100%;background:#b28a35}.row{display:flex;align-items:center;justify-content:space-between;gap:14px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.tabs button{background:#fff;color:#657267;border:1px solid #e0e2d8}.tabs button.active{background:#263b31;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:#fff;border:1px solid #e2e4da;border-radius:17px;overflow:hidden}.content{padding:20px}.food{height:155px;background:#eae4d5;display:flex;align-items:center;justify-content:center;font-size:65px}.food.alt{background:#e4e9dd}.price{font-size:21px;font-weight:750}.strike{text-decoration:line-through;color:#8c9289;font-size:13px;margin-left:7px}.badge{font-size:11px;background:#e8efdf;color:#38613c;padding:5px 8px;border-radius:6px}.basket{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:min(700px,92%);background:#263b31;color:white;padding:15px 22px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;z-index:3}.basket button{background:#f1d780;color:#263b31}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0}.stat{background:#fff;border:1px solid #e2e4da;border-radius:12px;padding:20px}.stat strong{font-size:28px;display:block;margin-top:10px}.panel{padding:25px;background:white;border:1px solid #e2e4da;border-radius:16px;margin:18px 0}.listrow{padding:18px 0;border-bottom:1px solid #eceee5;display:flex;justify-content:space-between;align-items:center;gap:15px}.listrow:last-child{border:0}.modal{position:fixed;inset:0;background:#17261dcc;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.dialog{background:#fafbf7;border-radius:20px;padding:28px;width:min(530px,100%);max-height:90vh;overflow:auto}label{display:block;font-size:13px;margin:17px 0 7px}input,select{width:100%;padding:12px;border:1px solid #ccd2c4;border-radius:8px;background:white}.toast{position:fixed;top:90px;right:20px;background:#263b31;color:white;padding:16px 22px;border-radius:10px;z-index:10}.note{font-size:12px;color:#7c8277;margin-top:18px}.empty{padding:35px;text-align:center}@media(max-width:700px){.hero{grid-template-columns:1fr;padding:23px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:28px}.demo{align-items:flex-start}header{padding:18px 24px}.hero h2{font-size:28px}.row{flex-wrap:wrap}.food{height:140px}}
</style></head><body><div class="demo"><span>INTERACTIVE CONCEPT · Sample data only · Resets on refresh</span><div class="switch"><button id="studentSwitch" onclick="side='student';tab='Combos';render()">Student</button><button id="canteenSwitch" onclick="side='canteen';tab='Overview';render()">Canteen</button></div></div><header><div class="logo">Spoon<span>Ate</span><div style="font-size:11px;letter-spacing:1px;font-weight:500;margin-top:4px">THE CAMPUS KITCHEN</div></div><span id="identity"></span></header><main id="app"></main><div id="overlay"></div><div id="cartbar"></div><div id="toast"></div>
<script>
let side='student',tab='Combos',tokens=32,cart=[],orders=[],offerActive=true;
let combos=[{name:'The lecture-break combo',desc:'Veg sandwich + regular cold coffee',price:119,old:140,icon:'🥪',active:true},{name:'The comfort bowl',desc:'Veg noodles + fresh lemonade',price:139,old:165,icon:'🍜',active:true},{name:'Little break, big flavour',desc:'Small fries + masala chai',price:79,old:95,icon:'🍟',active:true}];
const rewards=[{name:'Regular cold coffee',cost:50,icon:'🥤'},{name:'Fresh lemonade',cost:30,icon:'🍋'},{name:'Small fries',cost:40,icon:'🍟'}];
function notify(s){document.getElementById('toast').innerHTML='<div class="toast">'+s+'</div>';setTimeout(()=>document.getElementById('toast').innerHTML='',3000)}
function total(){return cart.reduce((s,i)=>s+i.price,0)}function used(){return cart.reduce((s,i)=>s+(i.cost||0),0)}
function add(i){cart.push({...i});render();notify('Added to your bag')}
function render(){document.getElementById('studentSwitch').className=side==='student'?'active':'';document.getElementById('canteenSwitch').className=side==='canteen'?'active':'';document.getElementById('identity').textContent=side==='student'?'Hello, Aanya · Student':'Owner workspace';let tabs=side==='student'?['Combos','Menu','Rewards','My orders']:['Overview','Combos','Promotions','Rewards','Orders'];document.getElementById('app').innerHTML=side==='student'?student(tabs):canteen(tabs);document.getElementById('cartbar').innerHTML=side==='student'&&cart.length?`<div class="basket"><span>${cart.length} items · <b>₹${total()}</b></span><button onclick="bag()">View bag →</button></div>`:''}
function nav(tabs){return '<div class="tabs">'+tabs.map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('')+'</div>'}
function student(tabs){return `<div class="row"><div><div class="eyebrow">Your everyday campus favourite</div><h1>Good food. Better breaks.</h1><span class="muted">Freshly made, ready when your order is.</span></div><span class="pill">● Accepting orders</span></div><section class="hero"><div><span class="eyebrow">${offerActive?'A little extra, on us':'Made for your campus breaks'}</span><h2>${offerActive?'Your lunch deserves a free coffee.':'Your favourites are waiting.'}</h2><p>${offerActive?'Spend ₹200 on eligible food and add a regular cold coffee for free.':'Explore today’s combos and collect tokens on completed purchases.'}</p><button onclick="${offerActive?'showOffer()':"tab=\'Combos\';render()"}">${offerActive?'See today’s offer →':'Explore combos →'}</button></div><div class="rewardbox"><div class="row"><span>Your reward journey</span><span class="badge">${tokens} tokens</span></div><h3>A treat worth coming back for.</h3><div class="progress"><i style="width:${Math.min(tokens/50*100,100)}%"></i></div><small>${tokens>=50?'Your cold coffee is unlocked.':`${50-tokens} more tokens to a free cold coffee.`}</small><p style="margin-bottom:0"><button class="secondary" onclick="tab='Rewards';render()">Explore rewards</button></p></div></section>${nav(tabs)}${studentContent()}`}
function studentContent(){if(tab==='Combos')return '<div class="row"><h2>A good pair. A better price.</h2><small>Fixed portions · No substitutions</small></div><div class="grid">'+combos.filter(c=>c.active).map((c)=>foodCard(c,`add(combos[${combos.indexOf(c)}])`)).join('')+'</div>';if(tab==='Menu')return '<h2>Campus classics</h2><div class="grid">'+[{name:'Veg sandwich',desc:'Toasted bread, vegetables & house chutney',price:80,icon:'🥪'},{name:'Regular cold coffee',desc:'Chilled, creamy & freshly blended',price:60,icon:'🥤'},{name:'Small fries',desc:'Golden fries with house seasoning',price:55,icon:'🍟'}].map(i=>foodCard(i,`add(${JSON.stringify(i).replaceAll('"','&quot;')})`)).join('')+'</div>';if(tab==='Rewards')return `<h2>Your tokens, your choice.</h2><p class="muted">Earn 1 token per ₹10 of paid food after discounts, rounded down per order. Tokens become available after payment and collection. No expiry in this concept.</p><div class="grid">${rewards.map((r,i)=>`<article class="card"><div class="food alt">${r.icon}</div><div class="content"><h3>${r.name}</h3><p>${r.cost} tokens</p><button ${tokens-used()<r.cost||used()>0?'disabled':''} onclick="add({...rewards[${i}],price:0,desc:'Token reward'})">${tokens-used()<r.cost?'Keep collecting':'Add reward'}</button></div></article>`).join('')}</div><p class="note">One token reward per order. Token rewards cannot be combined with the free-coffee promotion.</p>`;return '<h2>Your orders</h2>'+ (orders.length?orders.map(orderCard).join(''):'<div class="panel empty">Your next delicious break starts with the menu.</div>')}
function foodCard(c,action){return `<article class="card"><div class="food">${c.icon}</div><div class="content">${c.old?`<span class="badge">Save ₹${c.old-c.price}</span>`:''}<h3>${c.name}</h3><p class="muted">${c.desc}</p><div class="row"><span class="price">₹${c.price}${c.old?`<span class="strike">₹${c.old}</span>`:''}</span><button onclick="${action}">Add +</button></div></div></article>`}
function canteen(tabs){return `<div class="row"><div><div class="eyebrow">The campus kitchen · Management</div><h1>Your canteen, at a glance.</h1><span class="muted">Manage the offers students see and the food you serve.</span></div><button onclick="createPromo()">+ Create promotion</button></div>${nav(tabs)}${canteenContent()}`}
function canteenContent(){if(tab==='Overview')return `<div class="stats"><div class="stat">Demo orders<strong>${orders.length}</strong></div><div class="stat">Order value<strong>₹${orders.reduce((s,o)=>s+o.total,0)}</strong></div><div class="stat">Active combos<strong>${combos.filter(c=>c.active).length}</strong></div><div class="stat">Active promotions<strong>${offerActive?1:0}</strong></div></div><div class="panel"><div class="row"><h2>Live on the student homepage</h2><span class="badge">${offerActive?'Active':'Paused'}</span></div><h3>Spend ₹200, get a regular cold coffee</h3><p class="muted">Eligible paid food subtotal · Includes combos · One per order · Cannot combine with token redemption</p><button class="secondary" onclick="offerActive=!offerActive;render()">${offerActive?'Pause promotion':'Resume promotion'}</button></div><div class="panel"><h2>Try the full journey</h2><p class="muted">Switch to Student, add two combos, claim the free coffee, and place a demo order. Return to Orders here to prepare and collect it. Tokens are awarded on collection in this simulation.</p></div>`;if(tab==='Combos')return `<div class="row"><h2>Your combo menu</h2><button onclick="createCombo()">+ Create combo</button></div><div class="panel">${combos.map((c,i)=>`<div class="listrow"><div><h3>${c.name}</h3><small>${c.desc} · ₹${c.price} · Saves ₹${c.old-c.price}</small></div><button class="secondary" onclick="combos[${i}].active=!combos[${i}].active;render()">${c.active?'Pause':'Enable'}</button></div>`).join('')}</div>`;if(tab==='Promotions')return `<h2>Promotions & posters</h2><div class="hero"><div><span class="eyebrow">Student banner preview</span><h2>Your lunch deserves a free coffee.</h2><p>Spend ₹200 on eligible food. One regular cold coffee free.</p></div><div class="rewardbox"><span class="badge">${offerActive?'Live':'Paused'}</span><h3>Free coffee campaign</h3><p class="muted">Manual start/end · One claim per order · No stacking with token rewards</p><button onclick="offerActive=!offerActive;render()">${offerActive?'Pause campaign':'Publish campaign'}</button></div></div>`;if(tab==='Rewards')return `<h2>A simple reason to return.</h2><div class="panel"><div class="row"><div><h3>1 token for every ₹10</h3><p class="muted">Paid food after discounts · Award after collection · No expiry</p></div><span class="badge">Demo earning rule</span></div>${rewards.map(r=>`<div class="listrow"><span>${r.name}</span><b>${r.cost} tokens</b></div>`).join('')}<p class="note">Settings are fixed for this prototype. Students can redeem one reward per order.</p></div>`;return '<h2>Preparation queue</h2>'+(orders.length?orders.map(orderCard).join(''):'<div class="panel empty">Place a student demo order to see it here.</div>')}
function orderCard(o){return `<div class="panel"><div class="row"><h3>Order ${o.id}</h3><span class="badge">${o.status}</span></div>${o.items.map(i=>`<p>${i.name} ${i.cost?'· Token reward':i.promo?'· Promotion':''}<br><small>${i.desc||''}</small></p>`).join('')}<div class="row"><b>₹${o.total} · ${o.earn} tokens ${o.status==='Collected'?'earned':'pending'}</b>${side==='canteen'&&o.status!=='Collected'?`<button onclick="advance('${o.id}')">${({'Received':'Accept order','Accepted':'Start preparing','Preparing':'Mark ready','Ready':'Confirm paid & collected'})[o.status]}</button>`:''}</div></div>`}
function advance(id){let o=orders.find(o=>o.id===id),states=['Received','Accepted','Preparing','Ready','Collected'];o.status=states[states.indexOf(o.status)+1];if(o.status==='Collected'){tokens+=o.earn;notify('Demo payment & collection confirmed. Tokens awarded.')}render()}
function modal(html){document.getElementById('overlay').innerHTML=`<div class="modal"><div class="dialog"><div class="row"><span class="eyebrow">Frontend prototype</span><button class="secondary" onclick="closeModal()">Close ×</button></div>${html}</div></div>`}function closeModal(){document.getElementById('overlay').innerHTML=''}
function showOffer(){modal('<h2>A coffee on the house.</h2><p>Spend ₹200 or more on paid food, including combos. Add one regular cold coffee free before submitting.</p><p class="muted">One per order. Cannot combine with token redemption. Offer available while this demo campaign is active.</p><button onclick="closeModal();tab=\'Combos\';render()">Browse combos</button>')}
function bag(){let eligible=offerActive&&total()>=200&&!used();modal(`<h2>Your bag</h2>${cart.map((i,n)=>`<div class="listrow"><div>${i.name}<br><small>${i.cost?i.cost+' tokens':'₹'+i.price}</small></div><button class="secondary" onclick="cart.splice(${n},1);render();bag()">Remove</button></div>`).join('')}${eligible?'<p class="badge">You qualify for a free coffee.</p><label><input id="freecoffee" type="checkbox" checked style="width:auto"> Add my free regular cold coffee</label>':offerActive&&!used()?`<p class="muted">₹${Math.max(0,200-total())} more to unlock the promotional coffee.</p>`:''}<h3>Total ₹${total()}</h3><p class="muted">${Math.floor(total()/10)} tokens pending after this order. ${used()?used()+' tokens will be redeemed.':''}</p><button ${!cart.length?'disabled':''} onclick="place()">Place demo order</button><p class="note">No payment is taken. Canteen collection simulates payment confirmation.</p>`)}
function place(){if(!cart.length)return;let free=document.getElementById('freecoffee')?.checked,items=cart.map(i=>({...i}));if(free)items.push({name:'Regular cold coffee',price:0,promo:true,desc:'Free with ₹200 eligible food'});let amount=total();tokens-=used();orders.unshift({id:'D'+String(orders.length+1).padStart(2,'0'),items,total:amount,earn:Math.floor(amount/10),status:'Received'});cart=[];closeModal();tab='My orders';render();notify('Demo order placed. Switch to Canteen → Orders.')}
function createCombo(){modal('<h2>Create a combo</h2><form onsubmit="saveCombo(event)"><label>Combo name</label><input name="title" required maxlength="60" placeholder="Afternoon favourites"><label>Included items & portions</label><input name="items" required placeholder="1 sandwich + 1 lemonade"><label>Individual total (₹)</label><input name="old" type="number" min="2" required><label>Combo price (₹)</label><input name="price" type="number" min="1" required><p class="note">Sample presentation only; menu inventory is not connected.</p><button>Publish demo combo</button></form>')}
function saveCombo(e){e.preventDefault();let d=new FormData(e.target),price=Number(d.get('price')),old=Number(d.get('old'));if(price>=old){notify('Combo price must be below the individual total');return}combos.push({name:d.get('title'),desc:d.get('items'),price,old,icon:'🍽️',active:true});closeModal();render();notify('Combo published in the student view')}
function createPromo(){modal('<h2>Promotion preview</h2><p>This prototype includes one working campaign: spend ₹200, get a regular cold coffee.</p><label>Campaign type</label><select><option>Free item above minimum spend</option></select><p class="muted">Preview its banner and pause or publish it from Promotions. Custom campaign rules would be part of implementation.</p><button onclick="closeModal();tab=\'Promotions\';render()">Open campaign</button>')}
// Escape owner-entered sample text before placing it in generated markup.
const originalSaveCombo=saveCombo;saveCombo=function(e){for(const name of ['title','items']){let input=e.target.elements[name];input.value=input.value.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}originalSaveCombo(e)};
render();
</script></body></html>
